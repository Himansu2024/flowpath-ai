# .github/workflows/ci-cd.yml
# FlowPath AI — Complete CI/CD Pipeline
# Triggers on push to main/staging branches and PRs to main
# Steps: Test → Build Docker → Push ECR → Migrate DB → Deploy EC2 → Health Check

name: FlowPath CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  AWS_REGION:         ap-south-1
  ECR_BACKEND_REPO:   flowpath-backend
  ECR_AI_REPO:        flowpath-ai

# ════════════════════════════════════════════════════════════════
jobs:

  # ── JOB 1: Backend Tests ─────────────────────────────────────
  test-backend:
    name: "Test: Node.js Backend"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_DB:       flowpath_test
          POSTGRES_USER:     flowpath_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Run tests with coverage
        run: cd backend && npm test -- --coverage --forceExit
        env:
          NODE_ENV:     test
          DB_HOST:      localhost
          DB_PORT:      5432
          DB_NAME:      flowpath_test
          DB_USER:      flowpath_user
          DB_PASSWORD:  testpassword
          REDIS_URL:    redis://localhost:6379
          JWT_SECRET:   test-secret-minimum-32-characters-here
          AI_ENGINE_URL: http://localhost:8000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  # ── JOB 2: AI Engine Tests ───────────────────────────────────
  test-ai:
    name: "Test: Python AI Engine"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-engine/requirements.txt

      - name: Install dependencies
        run: cd ai-engine && pip install -r requirements.txt pytest pytest-cov

      - name: Run AI engine tests
        run: cd ai-engine && python -m pytest tests/ -v --cov=app --cov-report=xml

      - name: Upload AI coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-coverage
          path: ai-engine/coverage.xml

  # ── JOB 3: Build & Push Docker Images ───────────────────────
  build:
    name: "Build: Docker Images → ECR"
    runs-on: ubuntu-latest
    needs: [test-backend, test-ai]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       docker/Dockerfile.backend
          push:       true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push AI engine image
        uses: docker/build-push-action@v5
        with:
          context:    .
          file:       docker/Dockerfile.ai
          push:       true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_AI_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_AI_REPO }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── JOB 4: Database Migrations ──────────────────────────────
  migrate:
    name: "Migrate: PostgreSQL Database"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:    ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:     ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            echo "Running FlowPath database migrations..."
            for f in /opt/flowpath/database/migrations/*.sql; do
              echo "  → $(basename $f)"
              PGPASSWORD="${{ secrets.DB_PASSWORD }}" psql \
                -h "${{ secrets.DB_HOST }}" \
                -U "${{ secrets.DB_USER }}" \
                -d flowpath_db \
                -f "$f" \
                --on-error-stop \
                2>&1 | tail -5 || true
            done
            echo "✅ All migrations complete"

  # ── JOB 5: Deploy to AWS EC2 ─────────────────────────────────
  deploy:
    name: "Deploy: AWS EC2"
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          envs:     AWS_REGION,ECR_BACKEND_REPO,ECR_AI_REPO
          script: |
            set -e
            echo "🚀 Deploying FlowPath AI..."

            # Pull latest code
            cd /opt/flowpath
            git fetch origin main && git reset --hard origin/main

            # Authenticate with ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Pull latest images
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:latest
            docker pull ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_AI_REPO }}:latest

            # Update env file with production values
            cat > /opt/flowpath/backend/.env << 'ENVEOF'
            NODE_ENV=production
            PORT=3000
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=flowpath_db
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AI_ENGINE_URL=http://ai-engine:8000
            AI_ENGINE_API_KEY=${{ secrets.AI_ENGINE_API_KEY }}
            REDIS_URL=redis://redis:6379
            ENVEOF

            # Rolling restart (zero downtime)
            docker-compose -f docker/docker-compose.yml up -d \
              --no-deps --force-recreate backend ai-engine

            # Clean up old images
            docker image prune -f --filter "until=24h"
            echo "✅ Deployment complete"

      - name: Health check
        run: |
          echo "Waiting 25s for services to start..."
          sleep 25
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            https://${{ secrets.CLOUDFRONT_DOMAIN }}/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check FAILED (HTTP $STATUS)"
            exit 1
          fi

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 FlowPath AI deployed successfully!"
          echo "   SHA:     ${{ github.sha }}"
          echo "   Time:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "   URL:     https://${{ secrets.CLOUDFRONT_DOMAIN }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "💥 Deployment FAILED for SHA ${{ github.sha }}"
          echo "   Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
