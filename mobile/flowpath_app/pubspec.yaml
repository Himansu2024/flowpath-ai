name: flowpath_app
description: FlowPath AI — Smart Traffic Navigation Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # GPS / Location
  geolocator: ^14.0.2
  permission_handler: ^11.0.1

  # Networking
  dio: ^5.4.0
  http: ^1.1.0

  # WebSocket / Real-time
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Voice navigation
  flutter_tts: ^3.8.3

  # Screen wake lock (keep screen on while navigating)
  wakelock_plus: ^1.1.4

  # Charts for analytics screen
  fl_chart: ^0.65.0

  # Share / export
  share_plus: ^7.2.1

  # Push notifications
  flutter_local_notifications: ^16.3.0

  # Dependency injection
  get_it: ^7.6.4

  # Date formatting
  intl: ^0.19.0

  # Animations
  animations: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

