# render.yaml — Free deployment on Render.com
# Render gives: 750 free hours/month for web services
# Database: use Supabase free tier (PostgreSQL + PostGIS, 500MB free)

services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: flowpath-backend
    env: node
    region: singapore   # closest to India
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false        # paste from Supabase dashboard
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false        # paste from Supabase dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: AI_ENGINE_URL
        sync: false        # paste after deploying AI engine
      - key: AI_ENGINE_API_KEY
        value: flowpath-prod-key
      - key: REDIS_URL
        sync: false        # paste from Upstash free Redis
      - key: SOCKET_CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info

  # ── Python AI Engine ─────────────────────────────────────────
  - type: web
    name: flowpath-ai
    env: python
    region: singapore
    plan: free
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: AI_ENGINE_API_KEY
        value: flowpath-prod-key
